<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Diabetic Retinopathy Detection</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <div class="h-1 bg-gradient-to-r from-green-500 to-blue-500"></div>
            
            <div class="p-8">
                <div class="text-center mb-2">
                    <h2 class="text-green-500 text-xl font-semibold">Diabetic Retinopathy Detection</h2>
                </div>
                <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">Create Account</h1>

                {% if error %}
                <div class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg animate__animated animate__fadeIn">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST" class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                        <input type="text" 
                               id="username" 
                               name="username" 
                               required 
                               placeholder="Choose a username"
                               class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 transition duration-300 outline-none">
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               required 
                               placeholder="Create a password"
                               class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 transition duration-300 outline-none">
                    </div>

                    <button type="submit" 
                            class="w-full py-3 px-4 bg-green-500 text-white rounded-lg font-medium hover:bg-green-600 transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-opacity-50">
                        Register
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="text-sm text-gray-600">Already have an account?
                        <a href="{{ url_for('login') }}" class="text-green-500 font-medium hover:underline">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
