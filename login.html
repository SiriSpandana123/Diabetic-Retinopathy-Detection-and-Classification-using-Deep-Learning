<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login/Register - Diabetic Retinopathy Detection</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    }
    .button-shift {
      transition: transform 0.3s ease, background-color 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-2xl shadow-xl overflow-hidden relative">
      <div class="h-1 bg-gradient-to-r from-blue-500 to-purple-600"></div>

      <!-- LOGIN FORM -->
      <div id="loginForm" class="p-8 transition-all duration-500 ease-in-out">
        <div class="text-center mb-2">
          <h2 class="text-blue-500 text-xl font-semibold">Diabetic Retinopathy Detection</h2>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">Welcome Back</h1>

        {% if error %}
          <div class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg animate__animated animate__fadeIn">
            {{ error }}
          </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}" class="space-y-6">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" placeholder="Enter your username">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" placeholder="Enter your password">
          </div>
          <button type="submit" class="w-full py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition hover:shadow-lg button-shift" id="submitBtn">
            Sign In
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-sm text-gray-600">Don't have an account? 
            <button onclick="toggleForms()" class="text-blue-500 font-medium hover:underline">Register</button>
          </p>
        </div>
      </div>

      <!-- REGISTER FORM (Initially hidden) -->
      <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="h-1 bg-gradient-to-r from-green-500 to-blue-500"></div>
      <div id="registerForm" class="p-8 absolute top-0 left-0 w-full bg-white transform translate-y-full transition-all duration-500 ease-in-out">
        
        <div class="text-center mb-2">
          <h2 class="text-green-500 text-xl font-semibold">Diabetic Retinopathy Detection</h2>
        </div>
        <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">Create Account</h1>

        {% if error %}
          <div class="mb-6 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg animate__animated animate__fadeIn">
            {{ error }}
          </div>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}" class="space-y-6">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
            <input type="text" name="username" required class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none" placeholder="Choose a username">
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg border-2 border-gray-200 focus:border-green-500 focus:ring-2 focus:ring-green-200 outline-none" placeholder="Create a password">
          </div>
          <button type="submit" class="w-full py-3 bg-green-500 text-white rounded-lg hover:bg-green-600 transition hover:shadow-lg button-shift" id="submitBtn">
            Register
          </button>
        </form>

        <div class="text-center mt-4">
          <p class="text-sm text-gray-600">Already have an account? 
            <button onclick="toggleForms()" class="text-green-500 font-medium hover:underline">Login</button>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');

    function toggleForms() {
      if (registerForm.classList.contains('translate-y-full')) {
        registerForm.classList.remove('translate-y-full');
        loginForm.classList.add('-translate-y-full');
        submitBtn.innerHTML = 'Register';
        submitBtn.classList.remove('bg-blue-500', 'hover:bg-blue-600');
        submitBtn.classList.add('bg-green-500', 'hover:bg-green-600');
      } else {
        registerForm.classList.add('translate-y-full');
        loginForm.classList.remove('-translate-y-full');
        submitBtn.innerHTML = 'Sign In';
        submitBtn.classList.remove('bg-green-500', 'hover:bg-green-600');
        submitBtn.classList.add('bg-blue-500', 'hover:bg-blue-600');
      }
    }
  </script>
</body>
</html>
